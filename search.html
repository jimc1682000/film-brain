<main>
  <h1>搜尋回放</h1>
  <p style="color:#999">
    以下是 <b>真實管線</b>(LLM query 理解 → 雙路海選 → 外卡 → cross-encoder 精排 →
    誠實分數)跑出的完整結果,預存為 JSON 回放 — 靜態站沒有後端,所以只能點預設查詢;
    分數、警示、可解釋標籤都是當時的真實輸出。
  </p>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
</main>
<footer class="site">
  Prototype built at the CATCHPLAY+ Hackathon 2026 · catalog metadata from public sources (CATCHPLAY+ / TMDB)
</footer>
<script src="common.js"></script>
<script>
let DATA = {};

function render(q) {
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c.dataset.q === q));
  const d = DATA[q];
  const u = d.understanding || {};
  const out = document.getElementById("out");
  let html = "";

  if (u.low_confidence) {
    html += `<div class="banner-warn">⚠ 片庫中沒有高度相關的結果,以下依接近程度排序,分數僅供參考</div>`;
  }
  const filters = (u.filters || []).map((f) => `<span class="tagchip">${f}</span>`).join("");
  const kws = (u.keywords || []).length ? `<span style="color:#999">關鍵字: ${u.keywords.join("、")}</span>` : "";
  const hyde = u.hyde_text ? `<div class="hyde">AI 推想劇情:「${u.hyde_text}」</div>` : "";
  html += `<div class="understanding"><span class="lbl">🔎 AI 怎麼理解你</span>${filters} ${kws}${hyde}</div>`;

  html += `<div class="grid">`;
  for (const r of d.results) {
    const ex = r.explain || {};
    const srcs = (ex.sources || []).filter((s) => SRC_LABEL[s]).map((s) => SRC_LABEL[s]);
    const prefs = (ex.matched_prefs || []).slice(0, 4).map((p) => `<span class="ptag">${p}</span>`).join("");
    let why = "";
    if (prefs) {
      const prefix = (ex.sources || []).length ? "符合" : "共同";
      why = `${prefix} ${prefs}` + (srcs.length ? ` <span>· ${srcs.join("+")}</span>` : "");
    } else if (srcs.length) {
      why = `命中 ${srcs.join("+")}`;
    }
    const tags = (r.matched_tags || []).slice(0, 5).map((t) => `<span class="mtag">${t}</span>`).join("");
    html += `
    <div class="card">
      <img src="${r.poster_url || ""}" alt="${r.title_zh}" loading="lazy"
           onerror="this.style.display='none'">
      <div class="body">
        <span class="score ${scoreClass(r.score)}">${Math.round(r.score * 100)}%</span>
        <div class="title">${r.title_zh}</div>
        <div class="title-en">${r.title_en || ""}</div>
        <div>${tags}</div>
        <div class="explain">${why}</div>
      </div>
    </div>`;
  }
  html += `</div>`;
  out.innerHTML = html;
}

fetch("data/searches.json")
  .then((r) => r.json())
  .then((j) => {
    DATA = j;
    const chips = document.getElementById("chips");
    Object.keys(j).forEach((q) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.dataset.q = q;
      b.textContent = q;
      b.onclick = () => render(q);
      chips.appendChild(b);
    });
    render(Object.keys(j)[0]);
  })
  .catch((e) => (document.getElementById("out").textContent = "載入失敗: " + e));
</script>
<script src="nav.js" defer></script>
</body>
</html>
