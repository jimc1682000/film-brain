<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff944c"/>
      <stop offset="0.55" stop-color="#f26f21"/>
      <stop offset="1" stop-color="#d4570c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
  </defs>

  <!-- backdrop card -->
  <rect x="20" y="20" width="280" height="280" rx="44" fill="url(#card)" stroke="#3a3a3a" stroke-width="2"/>

  <!-- clapperboard, gently tilted -->
  <g transform="rotate(-6 160 178)">
    <!-- board body -->
    <rect x="74" y="120" width="172" height="124" rx="10" fill="#161616" stroke="url(#or)" stroke-width="5"/>
    <g stroke="#3a3a3a" stroke-width="2.5">
      <line x1="74" y1="166" x2="246" y2="166"/>
      <line x1="74" y1="206" x2="246" y2="206"/>
      <line x1="132" y1="166" x2="132" y2="244"/>
      <line x1="190" y1="166" x2="190" y2="244"/>
    </g>

    <!-- hinged clapper stick with diagonal orange stripes -->
    <g transform="rotate(-20 78 120)">
      <rect x="72" y="86" width="180" height="32" rx="6" fill="url(#or)"/>
      <g fill="#161616">
        <polygon points="88,86 110,86 92,118 70,118"/>
        <polygon points="128,86 150,86 132,118 110,118"/>
        <polygon points="168,86 190,86 172,118 150,118"/>
        <polygon points="208,86 230,86 212,118 190,118"/>
        <polygon points="248,86 262,86 252,118 230,118"/>
      </g>
    </g>
  </g>
</svg>
