<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340" fill="none">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff944c"/>
      <stop offset="0.55" stop-color="#f26f21"/>
      <stop offset="1" stop-color="#d4570c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
  </defs>

  <!-- backdrop card -->
  <rect x="20" y="20" width="300" height="300" rx="44" fill="url(#card)" stroke="#3a3a3a" stroke-width="2"/>

  <!-- ===== Clapperboard (back-right) ===== -->
  <g transform="rotate(-8 210 150)">
    <!-- board body -->
    <rect x="150" y="92" width="150" height="120" rx="8" fill="#161616" stroke="url(#or)" stroke-width="4"/>
    <!-- ruled lines -->
    <g stroke="#3a3a3a" stroke-width="2">
      <line x1="150" y1="132" x2="300" y2="132"/>
      <line x1="150" y1="172" x2="300" y2="172"/>
      <line x1="200" y1="132" x2="200" y2="212"/>
      <line x1="250" y1="132" x2="250" y2="212"/>
    </g>
    <!-- hinged clapper top with diagonal stripes -->
    <g transform="rotate(-18 152 92)">
      <rect x="148" y="66" width="156" height="26" rx="5" fill="url(#or)"/>
      <g fill="#161616">
        <polygon points="160,66 176,66 162,92 146,92"/>
        <polygon points="192,66 208,66 194,92 178,92"/>
        <polygon points="224,66 240,66 226,92 210,92"/>
        <polygon points="256,66 272,66 258,92 242,92"/>
        <polygon points="288,66 304,66 290,92 274,92"/>
      </g>
    </g>
  </g>

  <!-- ===== Film reel (front-left) ===== -->
  <g transform="translate(124 158)">
    <circle r="74" fill="#161616" stroke="url(#or)" stroke-width="10"/>
    <circle r="20" fill="url(#or)"/>
    <!-- spokes (holes between hub and rim) -->
    <g fill="#0e0e0e" stroke="url(#or)" stroke-width="3">
      <circle cx="0" cy="-46" r="13"/>
      <circle cx="40" cy="-23" r="13"/>
      <circle cx="40" cy="23" r="13"/>
      <circle cx="0" cy="46" r="13"/>
      <circle cx="-40" cy="23" r="13"/>
      <circle cx="-40" cy="-23" r="13"/>
    </g>
  </g>

  <!-- ===== Film strip curl (bottom) ===== -->
  <g>
    <path d="M70 250 Q150 226 230 252 Q280 268 300 250 L300 286 Q278 304 228 288 Q152 262 80 286 Z"
          fill="#161616" stroke="url(#or)" stroke-width="3"/>
    <!-- perforations -->
    <g fill="url(#or)">
      <rect x="88" y="256" width="9" height="7" rx="1.5"/>
      <rect x="116" y="256" width="9" height="7" rx="1.5"/>
      <rect x="144" y="258" width="9" height="7" rx="1.5"/>
      <rect x="172" y="261" width="9" height="7" rx="1.5"/>
      <rect x="200" y="264" width="9" height="7" rx="1.5"/>
      <rect x="88" y="280" width="9" height="7" rx="1.5"/>
      <rect x="116" y="282" width="9" height="7" rx="1.5"/>
      <rect x="144" y="284" width="9" height="7" rx="1.5"/>
      <rect x="172" y="285" width="9" height="7" rx="1.5"/>
      <rect x="200" y="286" width="9" height="7" rx="1.5"/>
    </g>
  </g>
</svg>
