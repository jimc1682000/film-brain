# Run from pre-built images on GitHub Container Registry — no local image build.
# Pulls backend/frontend from GHCR instead of building from source; qdrant +
# ollama come from their upstream images either way.
#
#   docker compose -f docker-compose.ghcr.yml up -d
#   docker compose -f docker-compose.ghcr.yml exec backend \
#       python -m scripts.seed_from_file data/films.seed.json
#
# Images are published by .github/workflows/image.yml on every push to master
# (tag :master) and on version tags (:1.2.3). The packages must be public for
# a keyless pull — see README "Run from pre-built images".
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    restart: "no"

  backend:
    image: ghcr.io/jimc1682000/film-brain-backend:master
    ports:
      - "8000:8000"
    volumes:
      # Code is baked into the image; only data + the demo-chips config are
      # mounted from the cloned repo so the bundled mock dataset / seed work.
      - ./data:/app/data
      - ./frontend/chips.json:/app/chips.json:ro
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_BACKEND=ollama
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/jimc1682000/film-brain-frontend:master
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  ollama_models:
