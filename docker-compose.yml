services:
  # Local embedding model (bge-m3) — no API key. The one-shot ollama-pull
  # service below downloads the weights into the shared volume on first `up`.
  ollama:
    image: ollama/ollama:latest
    # Bind to loopback only — the model server has no auth, and the backend
    # reaches it over the Compose network (ollama:11434), not the host port.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"] # hits the API; passes once it's accepting
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Pulls bge-m3 once, then exits. backend waits on it completing so the first
  # embed/seed call always finds the model. Re-running `up` is a fast no-op
  # (weights cached in ollama_models).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy # API ready, not just process started
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: slim # Ollama embedding + RRF ranking. For the CrossEncoder
      # reranker (ADR 0009), use the prebuilt -st image (docker-compose.ghcr.yml).
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      # Demo chips, read-only — startup warms these queries' expansion cache.
      # Same file the frontend renders → single source.
      - ./frontend/chips.json:/app/chips.json:ro
    # Optional — a cloud LLM key enriches query understanding + auto-tagging.
    # Keyless runs fine without it (search degrades to BM25 + local vector).
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Embedding runs on the local ollama service — no API key.
      - EMBEDDING_BACKEND=ollama
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  ollama_models:
