name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff pinned to the pre-commit hook's rev (.pre-commit-config.yaml)
          # so CI's format check can't drift from local hooks across releases.
          pip install pytest pytest-cov pytest-asyncio pytest-mock ruff==0.15.17
          pip install pyright==1.1.410

      - name: Lint (ruff)
        run: ruff check backend

      - name: Format check (ruff)
        run: ruff format --check backend

      - name: Type check (pyright)
        run: bash scripts/typecheck.sh

      - name: DRY check (jscpd)
        run: npx --yes jscpd@5.0.9 --config .jscpd.json

      - name: Tests + total coverage gate (>=80%)
        run: |
          pytest backend/tests -q \
            --cov=backend --cov-report=term-missing \
            --cov-report=json --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true # primary auth: OIDC via the job's id-token (no secret needed)
          token: ${{ secrets.CODECOV_TOKEN }} # kept as fallback; harmless if unset
          fail_ci_if_error: false # Codecov is reporting only; the gates above enforce

      - name: Per-module coverage gate (every module >=80%)
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("coverage.json"))
          under = [
              (f, round(v["summary"]["percent_covered"], 1))
              for f, v in data["files"].items()
              if "/tests/" not in f and v["summary"]["percent_covered"] < 80
          ]
          if under:
              print("::error::modules below 80% coverage:")
              for f, p in sorted(under):
                  print(f"  {f}: {p}%")
              sys.exit(1)
          print("All non-test modules >= 80% coverage.")
          PY

      - name: OpenAPI schema up to date
        # The docs site renders site/docs/public/openapi.json (Redoc). Regenerate
        # from the live app and fail if the committed copy drifted — keeps the
        # published API reference in lockstep with the code.
        run: |
          python -m scripts.dump_openapi
          git diff --exit-code site/docs/public/openapi.json \
            || { echo "::error::openapi.json is stale — run: python -m scripts.dump_openapi"; exit 1; }

  # Taint-aware SAST (semgrep). Complements ruff's pattern-based `S` rules:
  # catches data-flow issues (incl. the httpx SSRF tripwire in .semgrep/ that
  # the free registry misses). pre-commit runs the local .semgrep/ rules on
  # changed files; this runs the full security ruleset on the whole tree.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install semgrep==1.166.0
      - name: Semgrep (security)
        run: >-
          semgrep scan --config p/security-audit --config .semgrep/
          --error --metrics off backend frontend scripts

  # Real-Qdrant wiring smoke. The `test` job mocks Qdrant everywhere; this runs
  # the vector_store ↔ Qdrant ↔ hybrid path against a live Qdrant service using
  # deterministic fake_embed vectors (no model download, no live HTTP server).
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && ok=1 && break
            sleep 1
          done
          # Fail loudly if Qdrant never came up — otherwise the qdrant-marked
          # tests would skip and the job would go falsely green.
          [ "${ok:-}" = 1 ] || { echo "Qdrant never became ready"; exit 1; }

      - name: Integration (real Qdrant)
        run: pytest backend/tests -m qdrant -q

  # Dockerfile lint (hadolint) + compose-file validation. Containers are part
  # of the public surface (docker run / compose), so gate them in CI too — not
  # just the pre-commit hadolint hook (which is bypassable / setup-dependent).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hadolint (Dockerfiles)
        run: |
          sudo curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint backend/Dockerfile backend/Dockerfile.st frontend/Dockerfile
      - name: Compose files valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.ghcr.yml config -q
      - name: Trivy (Dockerfile / config misconfig)
        # hadolint lints Dockerfile style; trivy catches misconfig classes it
        # misses (run-as-root DS-0002, missing HEALTHCHECK DS-0026, …). Gate on
        # HIGH/CRITICAL to avoid LOW best-practice noise hard-failing CI.
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.71.1 config \
            --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .venv /repo
          docker compose -f docker-compose.ghcr.yml -f docker-compose.staging.yml config -q
      - name: Caddyfile fmt + validate
        # Optional edge config (ADR 0025) — keep it formatted + structurally valid.
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src caddy:2 caddy fmt --diff Caddyfile
          bash scripts/caddy_validate.sh
          BASIC_AUTH_HASH=dummy docker compose -f docker-compose.ghcr.yml -f docker-compose.caddy.yml config -q
