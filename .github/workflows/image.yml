# Build + push images to GHCR so OSS users `docker run` (pull, no local build).
# Qdrant uses its upstream image. Two backend variants:
#   film-brain-backend       — slim (Ollama embedding + RRF ranking, ~480MB)
#   film-brain-backend-st    — slim + CrossEncoder reranker (ADR 0009), layered
#                              ON TOP of slim so it reuses the base layers
# plus film-brain-frontend (NiceGUI). The `backend-st` job needs `base` to push
# the slim image first (Dockerfile.st does FROM it).
name: Image
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Serialize image builds so concurrent master pushes can't race on the :master
# tag (an older/slower build finishing last would otherwise overwrite it).
# Don't cancel in-progress — let each push publish its immutable :sha- tag.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, dockerfile: backend/Dockerfile, target: slim }
          - { name: frontend, dockerfile: frontend/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3 # arm64 emulation for multi-arch build
      - uses: docker/setup-buildx-action@v4 # container driver — required for cache-to: type=gha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-st:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags for the slim base (to FROM) — same commit/ref → same tags as `base`.
      - id: basemeta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-backend-st
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile.st
          build-args: |
            BASE=ghcr.io/${{ github.repository }}-backend:${{ steps.basemeta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
