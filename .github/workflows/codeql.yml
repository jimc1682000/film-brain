name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended (not security-and-quality): keep the broader
          # SECURITY queries, drop the code-quality noise (unnecessary-lambda,
          # ineffectual-statement on Protocol `...` bodies, empty-except — all
          # intentional/FP here). ruff handles style/quality.
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
