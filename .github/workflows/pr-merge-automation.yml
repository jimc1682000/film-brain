name: PR merge automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master]
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number (empty = all open PRs)
        required: false
        default: ""
      dry_run:
        description: Classify only; do not label/comment/merge
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  statuses: read

jobs:
  evaluate:
    uses: jimc1682000/repo-policy/.github/workflows/pr-automerge.yml@v1.3
    with:
      default_branch: master
      policy_ref: v1.3
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
      policy_override_path: .github/policies/pr-automerge.yml
      automation_comment_authors: github-actions[bot],jimc1682000
      automation_workflow_name: PR merge automation
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      token: ${{ secrets.AUTOMERGE_TOKEN }}
