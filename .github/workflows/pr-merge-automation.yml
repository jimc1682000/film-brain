name: PR merge automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master]
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  statuses: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: master
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Checkout automation script only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/pr_merge_automation.py
          sparse-checkout-cone-mode: false

      - name: Evaluate PR merge policy
        run: python .github/scripts/pr_merge_automation.py
